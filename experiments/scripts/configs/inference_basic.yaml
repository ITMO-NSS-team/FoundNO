output:
  root: /workspace/fno_uq_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  - name: pdebench_2d_cfd
    source:
      location: url
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 100, 1]

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 16
        num_workers: 0
        pin_memory: true
        shuffle: true
        drop_last: true
      val:
        batch_size: 32
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false
      test:
        batch_size: 32
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false

normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 32

model:
  type: adapted_fno_no_mamba
  n_dim: 3
  hidden_channels: 60
  lifting_layers: 1
  projection_layers: 2
  core_layers: 4
  n_modes: [8, 30, 30]


inference:
  mc_drop_out:
    method: bernoulli #gaussian, bernoulli
    T: 20
    on_dropout: true
    lift_last_layer_drop: false
    p: 0.1
    target_coverage: 0.9
  experiment:
    T: [1, 100, 20, 20, 20, 20, 20]
    p: [0.0, 0.01, 0.1, 0.3, 0.5, 0.7, 0.9]


training:
  epochs: 10
  device: cuda
  train_main_fno: false
  gradient_accumulation_steps: 4
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
  uncertainty:
    - name: coverage_rate
      tasks: all
    - name: normalized_avg_bandwidth
      tasks: all