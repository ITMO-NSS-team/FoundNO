        - filename: data/valid/shear_flow_Reynolds_5e5_Schmidt_5e0.hdf5      


    adapter:
      type: temporal
      variable_name: data
      data_order: TCHW
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: TheWell
      physics_name: shear_flow

      #######
      extra_channels:
        - name: reynolds_from_data
          type: constant
          source: metadata
          key: Reynolds
          target: x

#        - name: reynolds_custom
#          type: constant
#          source: custom
#          value: 1.0
#          target: x

        - name: schmidt_from_data
          type: constant
          source: metadata
          key: Schmidt
          target: x

#        - name: schmidt_custom
#          type: constant
#          source: custom
#          value: 1.0
#          target: x

        # - name: grid_txy_custom
        #   type: coordinates
        #   source: custom
        #   axes: [ t, x, y ]
        #   normalize: false
        #   target: x
        #   ranges:
        #     t: [ 0.0, 20.0 ]
        #     x: [ 0.0, 1.0 ]
        #     y: [ -1.0, 1.0 ]

#        - name: grid_txy_normalize
#          type: coordinates
#          source: custom
#          axes: [ t, x, y ]
#          normalize: true
#          target: x
        #######

    trajectory_selection:
      count: 30
      strategy: first
      seed: 42
    #    split:
    #      type: ratios
    #      train: 0.7
    #      val: 0.1
    #      test: 0.2
    split:
      type: explicit
      train: [ 0, 20 ]
      val: [ 20, 25 ]
      test: [ 25, 30 ]
    loaders:
      train:
        batch_size: 2
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 2

model:
  type: adapted_fno
  n_dim: 3
  hidden_channels: 2
  lifting_layers: 1
  projection_layers: 1
  core_layers: 2
  n_modes:
    t: 2
    x: 2

training:
  epochs: 10
  device: cuda
  train_main_fno: true
  gradient_accumulation_steps: 2
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  #  gradient_accumulation_steps: 4
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

evaluation:
  after_training: true

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
