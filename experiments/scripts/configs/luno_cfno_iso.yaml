normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 400

# Ядро, лифтинг и проекция грузятся из чекпойнтов; блок нужен для сборки
# адаптер-ядро-адаптер (как при обучении cfno_9_11).
model:
  type: adapted_cfno_no_mamba
  n_dim: 3
  hidden_channels: 90
  lifting_layers: 2
  projection_layers: 2
  n_modes:
    t: 12
    x: 24

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
