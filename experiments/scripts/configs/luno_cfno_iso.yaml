# LUNO для ядра CFNO (weights/cfno_9_11), обученного на смеси shear flow
# (Re 1e4/1e5 x Schmidt 1e-1, 2e-1, 5e-1, 1e0, 5e0, 1e1; 30 кадров, 128x128,
# Reynolds и Schmidt -- доп. входные каналы). Одна физика -> task_idx: 0.
#
# in_distr  -- та же смесь, что в обучении: строит GGN (lifting) и калибрует.
# out_distr -- только оценка с GGN и prior_prec in_distr-задачи этого прогона
#              (метод и калибровочные ключи у них не задаются):
#   Re5e4_Sc1e0  -- Reynolds между обученными (интерполяция);
#   Re5e5_Sc1e0  -- Reynolds выше обученных (экстраполяция);
#   Re1e4_Sc2e0  -- Schmidt между обученными (интерполяция);
#   time         -- Re1e4 Sc1e0, горизонт x2 (кадры через один, те же 30);
#   space        -- Re1e4 Sc1e0, сетка 256x256 вместо 128x128.

output:
  root: /workspace/fno_uq_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  # Обучающая смесь (тот же список файлов, что при обучении).
  - name: thewell_shear_flow_mix
    task_idx: 0
    task_type: in_distr
    luno:
      # Метод UQ: Iso на лифтинге (max_rank: 0) -- GGN не строится,
      # ковариация весов лифтинга I / prior_prec, калибруется только prior_prec.
      ggn_target: lifting
      max_rank: 0
      jv_mode: forward
      # JVP через всю сеть CFNO (CNO-ветка + спектральные блоки) на выходе
      # ~2M элементов: 1 проба за раз, чтобы уложиться в 15 ГБ.
      fwd_batch: 1
      val_calib_frac: 0.8
      # Как в lifting-конфиге: одно число проб -- метрики сравнимы.
      diag_hutchinson: 32
      # У Iso пробы общие для всех кандидатов грида: 32 JVP на сэмпл при любом
      # размере грида; вся калибровочная часть val (~37 сэмплов).
      calib_max_samples: 0
      calib_grid_min: -4.0
      calib_grid_max: 12.0
      calib_grid_size: 49
      calib_objective: nll
    source:
      location: huggingface
      format: concat_thewell_hdf5
      repo_id: polymathic-ai/shear_flow
      cache_dir: /workspace/data/TheWell/shear_flow/hf_cache
      field_groups:
        t0_fields: [tracer, pressure]
        t1_fields: [velocity]
        t2_fields: []
      axis_selection:
        0:
          slice: [0, 30, 1]
        1:
          slice: [0, 256, 2]
        2:
          slice: [0, 512, 4]
      files:
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_1e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_1e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_1e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_1e1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_1e1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_1e1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_2e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_2e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_2e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_5e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_5e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_5e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_5e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_5e0.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_5e0.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_1e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_1e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e5_Schmidt_1e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_1e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_1e0.hdf5
        - filename: data/test/shear_flow_Reynolds_1e5_Schmidt_1e0.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_1e1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_1e1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e5_Schmidt_1e1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_2e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_2e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e5_Schmidt_2e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_5e-1.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_5e-1.hdf5
        - filename: data/test/shear_flow_Reynolds_1e5_Schmidt_5e-1.hdf5
        - filename: data/train/shear_flow_Reynolds_1e5_Schmidt_5e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e5_Schmidt_5e0.hdf5
    adapter:
      type: temporal
      variable_name: data
      data_order: TCHW
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: TheWell
      physics_name: shear_flow
      # Ядро обучено с Reynolds и Schmidt как константными входными каналами.
      extra_channels:
        - name: reynolds_from_data
          type: constant
          source: metadata
          key: Reynolds
          target: x
        - name: schmidt_from_data
          type: constant
          source: metadata
          key: Schmidt
          target: x
    split:
      type: ratios
      train: 0.7
      val: 0.1
      test: 0.2
    loaders:
      train:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

