output:
  root: /workspace/runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  - name: pdebench_2d_cfd
    source:
      location: url
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 20, 16]
    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd
    trajectory_selection:
      count: 2000
      strategy: first
      seed: 42
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 16
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: pdebench_2d_reacdiff
    source:
      location: url
      format: hdf5_grouped
      variable_path: data
      url: https://darus.uni-stuttgart.de/api/access/datafile/133017
      path: /workspace/data/PDEBench_data/2D_ReacDiff/2D_diff-react_NA_NA.h5
      axis_selection:
        0:
          linspace: [0, 50, 16]
    adapter:
      type: temporal
      variable_name: null
      data_order: TXYC
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_reacdiff
#    trajectory_selection:
#      count: 100
#      strategy: first
#      seed: 42
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 16
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: pdebench_swe
    source:
      location: url
      format: hdf5_grouped
      variable_path: data
      url: https://darus.uni-stuttgart.de/api/access/datafile/133021
      path: /workspace/data/PDEBench_data/SWE/2D_rdb_NA_NA.h5
      axis_selection:
        0:
          linspace: [0, 50, 16]
    adapter:
      type: temporal
      variable_name: null
      data_order: TXYC
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: swe
#    trajectory_selection:
#      count: 50
#      strategy: random
#      seed: 42
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 16
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 32
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: thewell_turbulent_radiative_layer_2d
    source:
      location: huggingface
      format: concat_thewell_hdf5
      repo_id: polymathic-ai/turbulent_radiative_layer_2D
      cache_dir: D:/TheWell/turbulent_radiative_layer_2D/hf_cache
      field_groups:
        t0_fields: [density, pressure]
        t1_fields: [velocity]
        t2_fields: []
      axis_selection:
        0:
          linspace: [0, 100, 16]
        1:
          slice: [0, 128, 2]
        2:
          slice: [0, 384, 3]
      files:
        - filename: data/train/turbulent_radiative_layer_tcool_0.03.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_0.06.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_0.10.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_0.18.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_0.32.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_0.56.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_1.00.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_1.78.hdf5
        - filename: data/train/turbulent_radiative_layer_tcool_3.16.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.03.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.06.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.10.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.18.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.32.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_0.56.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_1.00.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_1.78.hdf5
        - filename: data/valid/turbulent_radiative_layer_tcool_3.16.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.03.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.06.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.10.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.18.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.32.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_0.56.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_1.00.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_1.78.hdf5
        - filename: data/test/turbulent_radiative_layer_tcool_3.16.hdf5

    adapter:
      type: temporal
      variable_name: data
      data_order: TCHW
      temporal_mode: window
      input_time_indices: [0, 1, 2, 3]
      output_time_indices: [1, 2, 3, 4]
      flatten_time_to_channels: false
      benchmark_name: TheWell
      physics_name: turbulent_radiative_layer_2d

    split:
      type: explicit
      train: [0, 72]
      val: [72, 81]
      test: [81, 90]

    loaders:
      train:
        batch_size: 2
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: true
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: thewell_shear_flow
    source:
      location: huggingface
      format: concat_thewell_hdf5
      repo_id: polymathic-ai/shear_flow
      cache_dir: D:/TheWell/shear_flow/hf_cache
      field_groups:
        t0_fields: [tracer, pressure]
        t1_fields: []
        t2_fields: []
      axis_selection:
        0:
          linspace: [0, 199, 16]
        1:
          slice: [0, 256, 4]
        2:
          slice: [0, 512, 4]
      files:
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5

    adapter:
      type: temporal
      variable_name: data
      data_order: TCHW
      temporal_mode: window
      input_time_indices: [0, 1, 2, 3]
      output_time_indices: [1, 2, 3, 4]
      flatten_time_to_channels: false
      benchmark_name: TheWell
      physics_name: shear_flow

    split:
      type: ratios
      train: 0.7
      val: 0.1
      test: 0.2

    loaders:
      train:
        batch_size: 2
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: true
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false


normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 16

model:
  type: adapted_fno
  n_dim: 3
  hidden_channels: 120
  lifting_layers: 2
  projection_layers: 2
  core_layers: 2
  n_modes: [16, 32, 32]

training:
  epochs: 10
  device: cuda
  train_main_fno: true
  gradient_accumulation_steps: 4
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

evaluation:
  after_training: true

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
