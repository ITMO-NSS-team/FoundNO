        - repo_id: camlab-ethz/CE-Gauss
          cache_dir: /workspace/data/Poseidon_data/CE-Gauss/hf_cache
          filename: data_1.nc

    adapter:
      type: temporal
      variable_name: null
      data_order: TCHW
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: Poseidon
      physics_name: ce
      input_channel_indices: [0, 1, 2, 3, 4]
      output_channel_indices: [0, 1, 2, 3, 4]
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
