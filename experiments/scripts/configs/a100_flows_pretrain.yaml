normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 40

model:
  type: adapted_cfno # _no_mamba
  n_dim: 3
  hidden_channels: 90
  lifting_layers: 2
  projection_layers: 2
  n_modes:
    t: 12
    x: 24
  cno_levels: 4
  cno_blocks: 4

training:
  epochs: 10
  device: cuda
  train_main_fno: true
  gradient_accumulation_steps: 1
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

evaluation:
  after_training: true

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
