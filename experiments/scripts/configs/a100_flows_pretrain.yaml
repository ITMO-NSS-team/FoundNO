output:
  root: /workspace/runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  - name: pdebench_2d_cfd
    source:
      location: url
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

      extra_channels:
        - name: grid_txy_normalize
          type: coordinates
          source: custom
          axes: [ t, x, y ]
          normalize: true
          target: x

    trajectory_selection:
      count: 2000
      strategy: first
      seed: 42
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      

  - name: poseidon_ce
    source:
      location: huggingface
      format: concat_netcdf
      variable_name: data
      sample_dim: sample
      token_env: HF_TOKEN
      files:
        - repo_id: camlab-ethz/CE-RP
          cache_dir: /workspace/data/Poseidon_data/CE-RP/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-RP
          cache_dir: /workspace/data/Poseidon_data/CE-RP/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-KH
          cache_dir: /workspace/data/Poseidon_data/CE-KH/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-KH
          cache_dir: /workspace/data/Poseidon_data/CE-KH/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-CRP
          cache_dir: /workspace/data/Poseidon_data/CE-CRP/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-CRP
          cache_dir: /workspace/data/Poseidon_data/CE-CRP/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-Gauss
