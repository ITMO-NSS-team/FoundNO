output:
  root: /workspace/fno_uq_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

# task_type обязателен у каждой задачи:
#   in_distr  -- строит GGN и калибрует prior_prec; только здесь задаются метод
#                (ggn_target, max_rank, ggn_method) и ключи GGN/калибровки.
#                Одна in_distr-задача на task_idx в прогоне.
#   out_distr -- только оценка. luno: jv_mode, fwd_batch, vjp_chunk,
#                diag_hutchinson и, по желанию, источник:
#                  prior_prec_source: папка in_distr-задачи (luno_results.pkl)
#                  ggn_checkpoint:    её GGN-артефакт; метод берётся из файла,
#                                     без него -- Iso (только калибровка).
#                Если in_distr-задача того же task_idx есть в прогоне, берутся
#                её GGN и калибровка (пути игнорируются); иначе -- пути;
#                нет ни того, ни другого -- ошибка до старта.
tasks:
### CFD ###
  - name: pdebench_2d_cfd
    task_idx: 0
    task_type: in_distr
    luno:
      # Метод UQ: Iso на лифтинге (max_rank: 0) -- GGN не строится,
      # ковариация весов лифтинга I / prior_prec, калибруется только
      # prior_prec (без температуры).
      ggn_target: lifting
      max_rank: 0
      jv_mode: forward
      # Дисперсия -- forward-mode JVP через всю сеть (~0.175 с на пробу при
      # fwd_batch 2 для CFD 16x128x128).
      fwd_batch: 2
      val_calib_frac: 0.8
      # 16 проб на сэмпл -> ~3 с на сэмпл; вся оценка CFD (~7000 сэмплов
      # val+test) ~6 ч. Одно число на всех задачах CFD.
      diag_hutchinson: 16
      # У Iso пробы общие для всех кандидатов грида (16 JVP на сэмпл при любом
      # размере грида), поэтому грид частый и широкий; 128 сэмплов ~7 мин.
      calib_max_samples: 128
      calib_grid_min: -4.0
      calib_grid_max: 12.0
      calib_grid_size: 49
      calib_objective: nll
    source:
      location: local
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 20, 16]

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: true
        drop_last: true
      val:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false
      test:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false

