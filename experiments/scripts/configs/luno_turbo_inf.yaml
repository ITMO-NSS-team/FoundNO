  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 16

model:
  type: adapted_fno_no_mamba
  n_dim: 3
  hidden_channels: 120
  lifting_layers: 3
  projection_layers: 2
  core_layers: 4
