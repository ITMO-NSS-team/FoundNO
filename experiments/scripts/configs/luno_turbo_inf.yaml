###  polymathic-ai/turbulent_radiative_layer_2D ###

  - name: thewell_shear_flow
    task_idx: 4
    task_type: in_distr
    luno:
      # Метод UQ. ggn_target: lifting -- полная GGN лифтинга (d x d, ~3e4)
      # сэмплированием выхода, калибруются prior_prec и температура;
      # last-block -- низкоранговая GGN последнего блока (max_rank,
      # ggn_oversample, ggn_power_iter) или ggn_method: kfac.
      # max_rank: 0 -- метод Iso (только изотропный prior) для любого target.
      ggn_target: lifting
      # max_rank: 0
      jv_mode: forward
      # fwd_batch 2 быстрее на колонку, чем 4 (прошлый прогон: 0.175 с против
      # 0.215 с на колонку для CFD 16x128x128) и требует меньше памяти.
      fwd_batch: 2
      vjp_chunk: 16
      # Train-выборка маленькая: 200 = все сэмплы; ggn_mc: 0 -- авто,
      # сэмплов x ggn_mc >= 1.1 d.
      max_num_samples: 200
      ggn_mc: 0
      val_calib_frac: 0.8
      # Задачи shear flow дешёвые (единицы сэмплов в val/test): больше проб --
      # меньше шума std; одно число на всех задачах shear flow.
      diag_hutchinson: 50
      calib_max_samples: 0
      calib_grid_min: -2.0
      calib_grid_max: 10.0
      calib_grid_size: 25
      calib_objective: nll
    source:
      location: huggingface
      format: concat_thewell_hdf5
      repo_id: polymathic-ai/shear_flow
      cache_dir: /workspace/data/TheWell/shear_flow/thewell_shear_flow
      field_groups:
        t0_fields:
          - tracer
          - pressure
        t1_fields: []
        t2_fields: []
      axis_selection:
        0:
          linspace: [0, 20, 16]
        1:
          slice: [0, 256, 4]
        2:
          slice: [0, 512, 4]
      files:
        - filename: data/train/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/valid/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
        - filename: data/test/shear_flow_Reynolds_1e4_Schmidt_1e0.hdf5
    adapter:
      type: temporal
      variable_name: data
      data_order: TCHW
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: TheWell
      physics_name: shear_flow
    split:
      type: ratios
      train: 0.7
      val: 0.1
      test: 0.2
