normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 16

model:
  type: adapted_fno_no_mamba
  n_dim: 3
  hidden_channels: 120
  lifting_layers: 3
  projection_layers: 2
  core_layers: 4
  n_modes: [16, 32, 32]

training:
  epochs: 10
  device: cuda
  train_main_fno: true
  gradient_accumulation_steps: 4
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
