output:
  root: /workspace/fno_uq_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
### CFD ###
  - name: pdebench_2d_cfd
    task_idx: 0
    task_type: in_distr
    luno:
      jv_mode: forward
      fwd_batch: 1
      vjp_chunk: 16
      max_rank: 0
      ggn_method: randomized
      ggn_oversample: 0
      max_num_samples: 2
      val_calib_frac: 0.8
      diag_hutchinson: 50
      calib_max_samples: 0
      calib_grid_min: -3.0
      calib_grid_max: 3.0
      calib_grid_size: 50
      calib_objective: nll
    source:
      location: url
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 20, 16]

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: true
        drop_last: true
      val:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false
      test:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false

