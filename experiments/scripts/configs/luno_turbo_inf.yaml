output:
  root: /workspace/fno_uq_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

# task_type обязателен у каждой задачи:
#   in_distr  -- строит GGN и калибрует prior_prec; только здесь задаются метод
#                (ggn_target, max_rank, ggn_method) и ключи GGN/калибровки.
#                Одна in_distr-задача на task_idx в прогоне.
#   out_distr -- только оценка. luno: jv_mode, fwd_batch, vjp_chunk,
#                diag_hutchinson и, по желанию, источник:
#                  prior_prec_source: папка in_distr-задачи (luno_results.pkl)
#                  ggn_checkpoint:    её GGN-артефакт; метод берётся из файла,
#                                     без него -- Iso (только калибровка).
#                Если in_distr-задача того же task_idx есть в прогоне, берутся
#                её GGN и калибровка (пути игнорируются); иначе -- пути;
#                нет ни того, ни другого -- ошибка до старта.
tasks:
### CFD ###
  - name: pdebench_2d_cfd
    task_idx: 0
    task_type: in_distr
    luno:
      # Метод UQ. ggn_target: lifting -- полная GGN лифтинга (d x d, ~3e4)
      # сэмплированием выхода, калибруются prior_prec и температура;
      # last-block -- низкоранговая GGN последнего блока (max_rank,
      # ggn_oversample, ggn_power_iter) или ggn_method: kfac.
      # max_rank: 0 -- метод Iso (только изотропный prior) для любого target.
      ggn_target: lifting
      # max_rank: 0
      jv_mode: forward
      # fwd_batch 2 быстрее на колонку, чем 4 (прошлый прогон: 0.175 с против
      # 0.215 с на колонку для CFD 16x128x128) и требует меньше памяти.
      fwd_batch: 2
      vjp_chunk: 16
      # GGN: 1000 сэмплов x ggn_mc котангенсов (обратных проходов). ggn_mc: 0 --
      # авто, сэмплов x ggn_mc >= 1.1 d (здесь 34): оценка полного ранга.
      # Оценка ~1.7 ч + eigh 29640x29640 (на GPU, при нехватке памяти -- на CPU).
      max_num_samples: 1000
      ggn_mc: 0
      # ggn_checkpoint: <файл полной GGN лифтинга> -- взять готовую GGN вместо
      # расчёта (калибровка всё равно выполняется). Новый артефакт (~3.5 ГБ)
      # пишется в папку задачи.
      val_calib_frac: 0.8
      # Одно число проб на всех задачах CFD: шум оценки std (~1/sqrt(2*16),
      # около 18 %) одинаков, и метрики задач сравнимы между собой.
      diag_hutchinson: 16
      # Калибровка: при полном базисе дисперсия считается отдельными пробами на
      # каждого кандидата (25 x 16 JVP на сэмпл) -> 16 сэмплов (~20 мин); для
      # двух скаляров (prior_prec, температура) по 1e6 элементов на сэмпл этого
      # хватает. Грид шире: prior_prec конкурирует с собственными значениями
      # GGN (до ~1e11), масштаб std задаёт температура.
      calib_max_samples: 16
      calib_grid_min: -2.0
      calib_grid_max: 10.0
      calib_grid_size: 25
      calib_objective: nll
    source:
      location: local
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 20, 16]

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: true
        drop_last: true
      val:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false
      test:
        batch_size: 8
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false

