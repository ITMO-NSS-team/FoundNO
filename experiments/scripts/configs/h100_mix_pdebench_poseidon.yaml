output:
  root: /workspace/runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  - name: pdebench_2d_cfd
    source:
      location: url
      format: hdf5
      sample_dim: 0
      variables:
        density: density
        pressure: pressure
        Vx: Vx
        Vy: Vy
      url: https://darus.uni-stuttgart.de/api/access/datafile/164687
      path: /workspace/data/PDEBench_data/2D_CFD/2D_CFD_Rand_M0.1_Eta0.01_Zeta0.01_periodic_128_Train.hdf5
      axis_selection:
        0:
          linspace: [0, 20, 16]

    adapter:
      type: temporal
      variable_names: [density, pressure, Vx, Vy]
      data_order: TXY
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_cfd

    split:
      type: ratios
      train: 0.7
      val: 0.1
      test: 0.2

    loaders:
      train:
        batch_size: 16
        num_workers: 0
        pin_memory: true
        shuffle: true
        drop_last: true
      val:
        batch_size: 32
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false
      test:
        batch_size: 32
        num_workers: 0
        pin_memory: true
        shuffle: false
        drop_last: false

